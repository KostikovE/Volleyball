version: "3.9"

services:
 
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - PYTHONUNBUFFERED=1

 
  worker:
    build: .
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    volumes:
      - .:/code
    depends_on:
      - redis
    environment:
      - PYTHONUNBUFFERED=1

  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"